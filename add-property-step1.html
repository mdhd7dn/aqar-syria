<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة عقار - الخطوة الأولى</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="add-property.css">
</head>
<body>
    <div class="add-property-modal" id="addPropertyModal">
        <div class="modal-content">
            <!-- رأس النموذج -->
            <div class="modal-header">
                <h2>إضافة عقار جديد</h2>
                <button class="close-btn" id="closeBtn">&times;</button>
            </div>

            <!-- شريط التقدم -->
            <div class="progress-bar">
                <div class="progress-step active">
                    <span class="step-number">1</span>
                    <span class="step-label">نوع العقار</span>
                </div>
                <div class="progress-line active"></div>
                <div class="progress-step">
                    <span class="step-number">2</span>
                    <span class="step-label">البيانات والسعر</span>
                </div>
                <div class="progress-line"></div>
                <div class="progress-step">
                    <span class="step-number">3</span>
                    <span class="step-label">التأكيد</span>
                </div>
            </div>

            <!-- محتوى الخطوة الأولى -->
            <div class="modal-body">
                <!-- اختيار نوع العقار -->
                <div class="form-section">
                    <h3>ما نوع العقار الذي تريد إضافته؟</h3>
                    <div class="property-types-grid">
                        <div class="property-type-card" data-type="house">
                            <div class="type-icon">
                                <i class="fas fa-home"></i>
                            </div>
                            <span>بيت للبيع</span>
                        </div>

                        <div class="property-type-card" data-type="house-rent">
                            <div class="type-icon">
                                <i class="fas fa-house"></i>
                            </div>
                            <span>بيت للإيجار</span>
                        </div>

                        <div class="property-type-card" data-type="apartment">
                            <div class="type-icon">
                                <i class="fas fa-building"></i>
                            </div>
                            <span>شقة سكنية</span>
                        </div>

                        <div class="property-type-card" data-type="land">
                            <div class="type-icon">
                                <i class="fas fa-tree"></i>
                            </div>
                            <span>أرض</span>
                        </div>

                        <div class="property-type-card" data-type="commercial">
                            <div class="type-icon">
                                <i class="fas fa-store"></i>
                            </div>
                            <span>محل تجاري</span>
                        </div>

                        <div class="property-type-card" data-type="villa">
                            <div class="type-icon">
                                <i class="fas fa-gopuram"></i>
                            </div>
                            <span>فيلا</span>
                        </div>

                        <div class="property-type-card" data-type="office">
                            <div class="type-icon">
                                <i class="fas fa-briefcase"></i>
                            </div>
                            <span>مكتب</span>
                        </div>

                        <div class="property-type-card" data-type="garage">
                            <div class="type-icon">
                                <i class="fas fa-car"></i>
                            </div>
                            <span>موقف سيارات</span>
                        </div>
                    </div>
                </div>

                <!-- رفع الصور -->
                <div class="form-section">
                    <h3>رفع صور العقار</h3>
                    <div class="upload-container">
                        <div class="upload-area" id="uploadArea">
                            <div class="upload-icon">
                                <i class="fas fa-cloud-upload-alt"></i>
                            </div>
                            <p class="upload-text">اسحب الصور هنا أو انقر للاختيار</p>
                            <p class="upload-subtext">يمكنك تحميل حتى 8 صور (JPG, PNG)</p>
                            <input type="file" id="imageInput" multiple accept="image/*" style="display: none;">
                        </div>
                        <div class="images-preview" id="imagesPreview"></div>
                    </div>
                </div>
            </div>

            <!-- أزرار التنقل -->
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelBtn">إلغاء</button>
                <button class="btn btn-primary" id="nextBtn" disabled>التالي</button>
            </div>
        </div>
    </div>

    <script src="add-property.js"></script>
</body>
</html>
