<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار فتح الـ Modal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="add-property.css">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        .debug-panel {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .debug-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
            font-family: 'Cairo', sans-serif;
        }
        .debug-btn:hover {
            background: #0056b3;
        }
        .debug-log {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 10px;
            margin-top: 10px;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="debug-panel">
        <h2>🧪 اختبار الـ Modal</h2>
        <button class="debug-btn" onclick="testOpenModal()">فتح الـ Modal</button>
        <button class="debug-btn" onclick="testSelectType()">اختر نوع عقار</button>
        <button class="debug-btn" onclick="testUploadImage()">ارفع صورة (وهمية)</button>
        <button class="debug-btn" onclick="testClickNext()">اضغط على التالي</button>
        <button class="debug-btn" onclick="clearLog()">مسح السجل</button>
        <div class="debug-log" id="debugLog"></div>
    </div>

    <!-- Modal من index.html -->
    <div class="add-property-modal" id="addPropertyModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>إضافة عقار جديد</h2>
                <button class="close-btn" id="closeBtn">&times;</button>
            </div>

            <div class="progress-bar">
                <div class="progress-step active">
                    <span class="step-number">1</span>
                    <span class="step-label">نوع العقار</span>
                </div>
                <div class="progress-line active"></div>
                <div class="progress-step">
                    <span class="step-number">2</span>
                    <span class="step-label">البيانات والسعر</span>
                </div>
                <div class="progress-line"></div>
                <div class="progress-step">
                    <span class="step-number">3</span>
                    <span class="step-label">التأكيد</span>
                </div>
            </div>

            <div class="modal-body">
                <div class="form-section">
                    <h3>ما نوع العقار الذي تريد إضافته؟</h3>
                    <div class="property-types-grid">
                        <div class="property-type-card" data-type="house">
                            <div class="type-icon"><i class="fas fa-home"></i></div>
                            <span>بيت للبيع</span>
                        </div>
                        <div class="property-type-card" data-type="house-rent">
                            <div class="type-icon"><i class="fas fa-house"></i></div>
                            <span>بيت للإيجار</span>
                        </div>
                        <div class="property-type-card" data-type="apartment">
                            <div class="type-icon"><i class="fas fa-building"></i></div>
                            <span>شقة سكنية</span>
                        </div>
                        <div class="property-type-card" data-type="land">
                            <div class="type-icon"><i class="fas fa-tree"></i></div>
                            <span>أرض</span>
                        </div>
                        <div class="property-type-card" data-type="commercial">
                            <div class="type-icon"><i class="fas fa-store"></i></div>
                            <span>محل تجاري</span>
                        </div>
                        <div class="property-type-card" data-type="villa">
                            <div class="type-icon"><i class="fas fa-gopuram"></i></div>
                            <span>فيلا</span>
                        </div>
                        <div class="property-type-card" data-type="office">
                            <div class="type-icon"><i class="fas fa-briefcase"></i></div>
                            <span>مكتب</span>
                        </div>
                        <div class="property-type-card" data-type="garage">
                            <div class="type-icon"><i class="fas fa-car"></i></div>
                            <span>موقف سيارات</span>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h3>رفع صور العقار</h3>
                    <div class="upload-container">
                        <div class="upload-area" id="uploadArea">
                            <div class="upload-icon"><i class="fas fa-cloud-upload-alt"></i></div>
                            <p class="upload-text">اسحب الصور هنا أو انقر للاختيار</p>
                            <p class="upload-subtext">يمكنك تحميل حتى 8 صور (JPG, PNG)</p>
                            <input type="file" id="imageInput" multiple accept="image/*" style="display: none;">
                        </div>
                        <div class="images-preview" id="imagesPreview"></div>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelBtn">إلغاء</button>
                <button class="btn btn-primary" id="nextBtn" disabled>التالي</button>
            </div>
        </div>
    </div>

    <script src="add-property.js"></script>
    <script>
        let propertyManager;
        
        function log(message) {
            const logDiv = document.getElementById('debugLog');
            const timestamp = new Date().toLocaleTimeString('ar-SA');
            const entry = `[${timestamp}] ${message}`;
            console.log(entry);
            logDiv.innerHTML += entry + '<br>';
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        function clearLog() {
            document.getElementById('debugLog').innerHTML = '';
        }
        
        function testOpenModal() {
            log('🔴 فتح الـ Modal...');
            if (!propertyManager) {
                log('⚙️ إنشاء المدير...');
                propertyManager = new AddPropertyManager();
            }
            const modal = document.getElementById('addPropertyModal');
            if (modal) {
                modal.style.display = 'flex';
                log('✅ تم فتح الـ Modal');
            } else {
                log('❌ لم يتم العثور على الـ Modal');
            }
        }
        
        function testSelectType() {
            log('🏠 محاولة اختيار نوع عقار...');
            if (!propertyManager) {
                log('❌ المدير غير موجود');
                return;
            }
            const card = document.querySelector('.property-type-card');
            if (card) {
                propertyManager.selectPropertyType(card);
                log('✅ تم اختيار: ' + propertyManager.propertyData.type);
            } else {
                log('❌ لم يتم العثور على بطاقة');
            }
        }
        
        function testUploadImage() {
            log('📸 محاولة رفع صورة وهمية...');
            if (!propertyManager) {
                log('❌ المدير غير موجود');
                return;
            }
            // إنشاء صورة وهمية
            const canvas = document.createElement('canvas');
            canvas.width = 100;
            canvas.height = 100;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#82b85c';
            ctx.fillRect(0, 0, 100, 100);
            
            canvas.toBlob((blob) => {
                const file = new File([blob], 'test-image.png', { type: 'image/png' });
                const files = [file];
                propertyManager.addImages(files);
                log('✅ تم رفع الصورة');
                
                // تفعيل الزر
                const nextBtn = document.getElementById('nextBtn');
                if (nextBtn && propertyManager.propertyData.type) {
                    nextBtn.disabled = false;
                    log('✅ تم تفعيل زر التالي');
                }
            });
        }
        
        function testClickNext() {
            log('➡️ محاولة الضغط على التالي...');
            if (!propertyManager) {
                log('❌ المدير غير موجود');
                return;
            }
            const nextBtn = document.getElementById('nextBtn');
            if (nextBtn && !nextBtn.disabled) {
                log('✅ زر التالي مفعّل - بدء الانتقال');
                propertyManager.nextStep();
            } else {
                log('❌ زر التالي معطّل أو غير موجود');
            }
        }
        
        // بدء التشغيل
        window.addEventListener('load', () => {
            log('✅ الصفحة جاهزة');
        });
    </script>
</body>
</html>
